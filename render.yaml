services:
  - type: web
    name: house-of-muktai-incentives
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://houseofmuktai.co.in
      - key: ALLOWED_ORIGINS
        value: https://houseofmuktai.co.in,https://www.houseofmuktai.co.in,https://staff.houseofmuktai.co.in
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: eleven_flash_v2_5
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_MODEL_ID
        value: bulbul:v3


