# Nginx Reverse Proxy Configuration for House of Muktai
# Domains:
#   - https://houseofmuktai.co.in       (Admin Panel - Desktop & Mobile)
#   - https://www.houseofmuktai.co.in   (Redirects to https://houseofmuktai.co.in)
#   - https://staff.houseofmuktai.co.in (Dedicated Employee Mobile PWA App)
#
# Install path on Ubuntu/Debian VPS:
#   sudo cp deploy/nginx-houseofmuktai.conf /etc/nginx/sites-available/houseofmuktai.co.in
#   sudo ln -s /etc/nginx/sites-available/houseofmuktai.co.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d houseofmuktai.co.in -d www.houseofmuktai.co.in -d staff.houseofmuktai.co.in

server {
    listen 80;
    listen [::]:80;
    server_name houseofmuktai.co.in www.houseofmuktai.co.in staff.houseofmuktai.co.in;

    # Allow ERP .xlsx workbooks up to 15 MB
    client_max_body_size 15M;

    # Gzip compression for fast mobile loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
